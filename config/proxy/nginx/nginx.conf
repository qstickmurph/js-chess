events {}

http {
    resolver 127.0.0.11 ipv6=off;

    upstream web {
        server web;
    }

    upstream api {
        server api:8080;
    }

    server {
        listen 80;
        
        location / {
            proxy_pass http://web/;
        }

        location /api/ {
            proxy_pass http://api/;
        }

    }

    server {
        listen  443;

        return 301 http://$host$uri$is_args$args;
        
    }
}
